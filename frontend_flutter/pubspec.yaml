name: premium_companion_app
description: Ultra Premium Companion Booking Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Gestion d'état
  flutter_bloc: ^8.1.3
  # Injection de dépendances
  get_it: ^7.6.4
  # Réseau & Backend
  supabase_flutter: ^1.10.2
  dio: ^5.3.3
  # UI & Animations
  google_fonts: ^6.1.0
  glassmorphism_ui: ^0.2.0
  lottie: ^2.7.0
  cached_network_image: ^3.3.0
  # Géo
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  # Paiements
  flutter_stripe: ^9.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
