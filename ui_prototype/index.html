<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETPRO - Prototype UI</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --accent-color: #00E676;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --border-radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--surface-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .balance {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            font-weight: bold;
        }

        .match-card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .ai-btn {
            background: linear-gradient(45deg, #00E676, #00B0FF);
            border: none;
            border-radius: 20px;
            color: white;
            padding: 5px 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .odds-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .odd-btn {
            flex: 1;
            background-color: #2A2A2A;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            color: var(--text-primary);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .odd-btn:hover {
            border-color: var(--accent-color);
        }

        .odd-btn.selected {
            background-color: rgba(0, 230, 118, 0.2);
            border-color: var(--accent-color);
        }

        .odd-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .odd-value {
            font-weight: bold;
            color: var(--accent-color);
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .badge {
            background-color: #2A2A2A;
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--accent-color);
            color: #121212;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.4);
            cursor: pointer;
            z-index: 1000;
        }

        .fab .count {
            position: absolute;
            top: 0;
            right: 0;
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h2>BETPRO</h2>
        <div class="balance">$ 1,250.00</div>
    </header>

    <div class="container">
        <div class="tabs">
            <div class="tab active">Upcoming</div>
            <div class="tab">Live</div>
            <div class="tab">Settings</div>
        </div>

        <!-- Match Card 1 -->
        <div class="match-card">
            <div class="match-header">
                <span>Today, 20:45 • Champions League</span>
                <button class="ai-btn">✨ Ask AI</button>
            </div>
            <div class="teams">
                <span>Real Madrid</span>
                <span>vs</span>
                <span>Manchester City</span>
            </div>
            <div class="odds-container">
                <div class="odd-btn">
                    <span class="odd-label">1</span>
                    <span class="odd-value">2.65</span>
                </div>
                <div class="odd-btn selected">
                    <span class="odd-label">X</span>
                    <span class="odd-value">3.40</span>
                </div>
                <div class="odd-btn">
                    <span class="odd-label">2</span>
                    <span class="odd-value">2.50</span>
                </div>
            </div>
            <div class="badges">
                <div class="badge">BTTS: 1.65</div>
                <div class="badge">O 2.5: 1.80</div>
            </div>
        </div>

        <!-- Match Card 2 -->
        <div class="match-card">
            <div class="match-header">
                <span>Tomorrow, 15:00 • Premier League</span>
                <button class="ai-btn">✨ Ask AI</button>
            </div>
            <div class="teams">
                <span>Arsenal</span>
                <span>vs</span>
                <span>Chelsea</span>
            </div>
            <div class="odds-container">
                <div class="odd-btn">
                    <span class="odd-label">1</span>
                    <span class="odd-value">1.85</span>
                </div>
                <div class="odd-btn">
                    <span class="odd-label">X</span>
                    <span class="odd-value">3.60</span>
                </div>
                <div class="odd-btn">
                    <span class="odd-label">2</span>
                    <span class="odd-value">4.20</span>
                </div>
            </div>
            <div class="badges">
                <div class="badge">BTTS: 1.90</div>
                <div class="badge">U 2.5: 2.10</div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button for Bet Slip -->
    <div class="fab">
        Slip
        <div class="count">1</div>
    </div>

</body>
</html>
